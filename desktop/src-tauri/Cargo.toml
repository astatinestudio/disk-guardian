[package]
name = "disk-guardian"
version = "1.5.0"
description = "Disk health monitor: SMART, power-on hours and live temperature of every disk"
edition = "2021"
rust-version = "1.77"
license = "MIT"
authors = ["Reza Ardi"]
repository = "https://github.com/astatinestudio/disk-guardian"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
ctrlc = { version = "3.4", features = ["termination"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_Security"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
