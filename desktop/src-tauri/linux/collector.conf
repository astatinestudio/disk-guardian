# Disk Guardian collector settings (/usr/bin/disk-guardian --service)
# After editing:  sudo systemctl restart disk-guardian

[collector]
# Seconds between full SMART scans (smartctl -x)
smart_interval = 300

# Seconds between live temperature reads for SSD / NVMe (kernel hwmon, very cheap)
temp_interval = 3

# Seconds between temperature reads for spinning disks (HDD).
# Disks in standby are never woken up.
hdd_temp_interval = 60

# Read HDD temperature through the drivetemp kernel module every temp_interval.
# Faster, but some drives then never spin down.
hdd_use_hwmon = false

# Wake a sleeping disk once if its SMART data has never been read
# (otherwise a disk that is always asleep would show no data at all).
# Pressing "Refresh now" in the app also reads sleeping disks.
wake_for_first_scan = true

# Group whose members may ask for a refresh or start / abort a self-test
# ("sudo" falls back to "wheel" on Fedora, openSUSE and Arch)
request_group = sudo

# Space separated block device names to ignore, e.g.:  ignore_devices = sdc sdd
ignore_devices =
